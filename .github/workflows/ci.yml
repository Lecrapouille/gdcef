name: CI for GDCEF Godot 4.x
on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - godot-4.x
    tags:
      - '*'  # Trigger on any tag
  pull_request:
    branches:
      - godot-4.x

jobs:
  # ============================================================================
  # Linux Build Job
  # ============================================================================
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Git checkout the gdCEF repository
      - name: Checkout GDCEF
        uses: actions/checkout@v4
        with:
          ref: godot-4.x
          submodules: true

      # Install system packages
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libgtk-3-dev

      # Setup Python Virtual Environment
      - name: Setup Python Virtual Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.7'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Compile GDCEF
      - name: Compile GDCEF
        run: python3 build.py

      # Check the build
      - name: Check build
        run: |
          ls cef_artifacts/linux/gdCefRenderProcess cef_artifacts/linux/libgdcef.so cef_artifacts/linux/libcef.so
          ls cef_artifacts/gdcef.gdextension cef_artifacts/locales/

      # Upload artifact
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gdcef-linux-x86_64
          path: cef_artifacts/

  # ============================================================================
  # Windows Build Job
  # ============================================================================
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # Needed because Godot editor and godot-cpp can find cl.exe while our
      # godot native modules cannot find it without this extra path
      - name: Setup MSVC (Windows only)
        uses: ilammy/msvc-dev-cmd@v1.10.0

      # Git checkout the gdCEF repository
      - name: Checkout GDCEF
        uses: actions/checkout@v4
        with:
          ref: godot-4.x
          submodules: true

      # Setup Python Virtual Environment
      - name: Setup Python Virtual Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.7'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Compile GDCEF
      - name: Compile GDCEF
        run: python3 build.py

      # Check the build
      - name: Check build
        run: |
          if (!(Test-Path -Path "cef_artifacts\windows\gdCefRenderProcess.exe")) { exit 1 }
          if (!(Test-Path -Path "cef_artifacts\windows\libgdcef.dll")) { exit 1 }
          if (!(Test-Path -Path "cef_artifacts\windows\libcef.dll")) { exit 1 }
          if (!(Test-Path -Path "cef_artifacts\gdcef.gdextension")) { exit 1 }
          if (!(Test-Path -Path "cef_artifacts\locales")) { exit 1 }

      # Upload artifact
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gdcef-windows-x86_64
          path: cef_artifacts/

  # ============================================================================
  # Release Packaging Job (only for tags or manual trigger)
  # ============================================================================
  # Creates a combined zip with Linux + Windows artifacts for GitHub Releases
  # ============================================================================
  package:
    name: Package Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          GODOT_VERSION=$(grep "^GODOT_VERSION" build.py | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "godot_version=$GODOT_VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine artifacts
        run: |
          mkdir -p cef_artifacts/linux cef_artifacts/windows cef_artifacts/locales

          # Copy Linux binaries
          if [ -d "artifacts/gdcef-linux-x86_64/linux" ]; then
            cp -r artifacts/gdcef-linux-x86_64/linux/* cef_artifacts/linux/
            chmod +x cef_artifacts/linux/*.so cef_artifacts/linux/*.so.* cef_artifacts/linux/gdCefRenderProcess 2>/dev/null || true
            echo "✓ Linux binaries copied"
          fi

          # Copy Windows binaries
          if [ -d "artifacts/gdcef-windows-x86_64/windows" ]; then
            cp -r artifacts/gdcef-windows-x86_64/windows/* cef_artifacts/windows/
            echo "✓ Windows binaries copied"
          fi

          # Copy shared files from Linux (or Windows)
          if [ -f "artifacts/gdcef-linux-x86_64/gdcef.gdextension" ]; then
            cp artifacts/gdcef-linux-x86_64/gdcef.gdextension cef_artifacts/
            cp artifacts/gdcef-linux-x86_64/VERSION cef_artifacts/
            cp -r artifacts/gdcef-linux-x86_64/locales/* cef_artifacts/locales/
          elif [ -f "artifacts/gdcef-windows-x86_64/gdcef.gdextension" ]; then
            cp artifacts/gdcef-windows-x86_64/gdcef.gdextension cef_artifacts/
            cp artifacts/gdcef-windows-x86_64/VERSION cef_artifacts/
            cp -r artifacts/gdcef-windows-x86_64/locales/* cef_artifacts/locales/
          fi

          cp LICENSE cef_artifacts/
          find cef_artifacts -type f | head -30

      - name: Create release zip
        run: |
          ZIP_NAME="gdcef-${{ steps.version.outputs.version }}_godot-${{ steps.version.outputs.godot_version }}.zip"
          zip -r "$ZIP_NAME" cef_artifacts/
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdcef-${{ steps.version.outputs.version }}_godot-${{ steps.version.outputs.godot_version }}
          path: cef_artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
