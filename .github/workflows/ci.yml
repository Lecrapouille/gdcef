name: CI for GDCEF Godot 4.x
on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - godot-4.x
    tags:
      - '*'  # Trigger on any tag
  pull_request:
    branches:
      - godot-4.x

jobs:
  # ============================================================================
  # Linux Build Job
  # ============================================================================
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Git checkout the gdCEF repository
      - name: Checkout GDCEF
        uses: actions/checkout@v4
        with:
          ref: godot-4.x
          submodules: true

      # Install system packages
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libgtk-3-dev

      # Setup Python Virtual Environment
      - name: Setup Python Virtual Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.7'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Compile GDCEF
      - name: Compile GDCEF
        run: python3 build.py

      # Check the build
      - name: Check build
        run: |
          ls cef_artifacts/gdCefRenderProcess cef_artifacts/libgdcef.so cef_artifacts/libcef.so

      # Upload artifact for packaging job
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gdcef-linux-x86_64
          path: cef_artifacts/
          retention-days: 1

  # ============================================================================
  # Windows Build Job
  # ============================================================================
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # Needed because Godot editor and godot-cpp can find cl.exe while our
      # godot native modules cannot find it without this extra path
      - name: Setup MSVC (Windows only)
        uses: ilammy/msvc-dev-cmd@v1.10.0

      # Git checkout the gdCEF repository
      - name: Checkout GDCEF
        uses: actions/checkout@v4
        with:
          ref: godot-4.x
          submodules: true

      # Setup Python Virtual Environment
      - name: Setup Python Virtual Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.7'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Compile GDCEF
      - name: Compile GDCEF
        run: python3 build.py

      # Check the build
      - name: Check build
        run: |
          if (!(Test-Path -Path "cef_artifacts\gdCefRenderProcess.exe")) { exit 1 }
          if (!(Test-Path -Path "cef_artifacts\libgdcef.dll")) { exit 1 }
          if (!(Test-Path -Path "cef_artifacts\libcef.dll")) { exit 1 }

      # Upload artifact for packaging job
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gdcef-windows-x86_64
          path: cef_artifacts/
          retention-days: 1

  # ============================================================================
  # Release Packaging Job
  # ============================================================================
  # This job combines all platform builds into a single release package.
  #
  # For version tags (v*):
  # - Creates gdcef-<VERSION>.zip and attaches it to GitHub Release
  # - GitHub Release files are kept indefinitely
  #
  # Package structure:
  #   cef_artifacts/           - Compiled CEF artifacts for all platforms
  #     linux/                 - Linux binaries (.so files)
  #     windows/               - Windows binaries (.dll files)
  #     gdcef.gdextension      - Godot extension configuration (all platforms)
  # ============================================================================
  package:
    name: Package Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: always() # Run even if one platform fails, package what's available
    permissions:
      contents: write

    steps:
      # Clone the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Read version from VERSION file
      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION)
          GODOT_VERSION=$(grep "^GODOT_VERSION" build.py | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "godot_version=$GODOT_VERSION" >> $GITHUB_OUTPUT
          echo "gdCEF version: $VERSION"
          echo "Godot version: $GODOT_VERSION"

      # Download all artifacts from previous jobs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Prepare release folder
      - name: Prepare release folder
        run: |
          RELEASE_DIR="cef_artifacts"
          mkdir -p "$RELEASE_DIR/linux"
          mkdir -p "$RELEASE_DIR/windows"

          # Copy Linux binaries
          if ls artifacts/gdcef-linux-x86_64/* 1>/dev/null 2>&1; then
            cp -r artifacts/gdcef-linux-x86_64/* "$RELEASE_DIR/linux/"
            echo "✓ Linux binaries copied"
          else
            echo "⚠ Warning: Linux artifacts not available (build may have failed)"
          fi

          # Copy Windows binaries
          if ls artifacts/gdcef-windows-x86_64/* 1>/dev/null 2>&1; then
            cp -r artifacts/gdcef-windows-x86_64/* "$RELEASE_DIR/windows/"
            echo "✓ Windows binaries copied"
          else
            echo "⚠ Warning: Windows artifacts not available (build may have failed)"
          fi

          # Copy VERSION and LICENSE for reference
          cp VERSION LICENSE "$RELEASE_DIR/"
          echo "✓ VERSION and LICENSE copied"

          echo ""
          echo "=== Final package contents ==="
          find "$RELEASE_DIR" -type f | head -50

      # Create release archive
      - name: Create release archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          GODOT_VERSION="${{ steps.version.outputs.godot_version }}"
          ZIP_NAME="gdcef-${VERSION}_godot-${GODOT_VERSION}.zip"
          zip -r "$ZIP_NAME" cef_artifacts/
          echo "Created: $ZIP_NAME"
          unzip -l "$ZIP_NAME" | head -50
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      # Upload the zip file as a GitHub artifact (for all CI runs)
      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      # Create a GitHub Release with the zip file attached (only for tags)
      - name: Create GitHub Release
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
