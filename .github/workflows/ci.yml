name: CI for GDCEF Godot 4.x
on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - godot-4.x
    tags:
      - '*'  # Trigger on any tag
  pull_request:
    branches:
      - godot-4.x

jobs:
  # ============================================================================
  # Linux Build Job
  # ============================================================================
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Git checkout the gdCEF repository
      - name: Checkout GDCEF
        uses: actions/checkout@v4
        with:
          submodules: true

      # Install system packages
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxcomposite-dev libxdamage-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libgtk-3-dev

      # Setup Python Virtual Environment
      - name: Setup Python Virtual Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.7'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Compile GDCEF
      - name: Compile GDCEF
        run: python3 build.py

      # Check the build
      - name: Check build
        run: |
          ls cef_artifacts/linux/gdCefRenderProcess cef_artifacts/linux/libgdcef.so cef_artifacts/linux/libcef.so
          ls cef_artifacts/gdcef.gdextension cef_artifacts/linux/locales/

      # Upload artifact
      - name: Upload Linux artifacts
        uses: pyTooling/upload-artifact@v6
        with:
          name: gdcef-linux-x86_64
          path: cef_artifacts/

  # ============================================================================
  # Windows Build Job
  # ============================================================================
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # Needed because Godot editor and godot-cpp can find cl.exe while our
      # godot native modules cannot find it without this extra path
      - name: Setup MSVC (Windows only)
        uses: ilammy/msvc-dev-cmd@v1.10.0

      # Git checkout the gdCEF repository
      - name: Checkout GDCEF
        uses: actions/checkout@v4
        with:
          submodules: true

      # Setup Python Virtual Environment
      - name: Setup Python Virtual Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.7'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Compile GDCEF
      - name: Compile GDCEF
        run: python3 build.py

      # Check the build
      - name: Check build
        run: |
          if (!(Test-Path -Path "cef_artifacts\windows\gdCefRenderProcess.exe")) { exit 1 }
          if (!(Test-Path -Path "cef_artifacts\windows\libgdcef.dll")) { exit 1 }
          if (!(Test-Path -Path "cef_artifacts\windows\libcef.dll")) { exit 1 }
          if (!(Test-Path -Path "cef_artifacts\gdcef.gdextension")) { exit 1 }
          if (!(Test-Path -Path "cef_artifacts\windows\locales")) { exit 1 }

      # Upload artifact
      - name: Upload Windows artifacts
        uses: pyTooling/upload-artifact@v6
        with:
          name: gdcef-windows-x86_64
          path: cef_artifacts/

  # ============================================================================
  # Release Packaging Job (only for tags or manual trigger)
  # ============================================================================
  # Creates a combined zip with Linux + Windows artifacts for GitHub Releases
  # ============================================================================
  package:
    name: Package Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      # Using release/gdcef to avoid conflict with source gdcef/ folder from checkout
      RELEASE_DIR: release/gdcef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          GODOT_VERSION=$(grep "^GODOT_VERSION" build.py | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "godot_version=$GODOT_VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: pyTooling/download-artifact@v7
        with:
          path: artifacts

      - name: Combine artifacts
        run: |
          CEF_DIR="$RELEASE_DIR/cef_artifacts"
          LINUX_SRC="artifacts/gdcef-linux-x86_64/cef_artifacts"
          WINDOWS_SRC="artifacts/gdcef-windows-x86_64/cef_artifacts"
          mkdir -p "$CEF_DIR/linux" "$CEF_DIR/windows"

          # Copy Linux binaries (includes per-OS locales under linux/locales/)
          if [ -d "$LINUX_SRC/linux" ]; then
            cp -a "$LINUX_SRC/linux/"* "$CEF_DIR/linux/"
            # Ensure executable permissions on shared libraries and subprocess
            find "$CEF_DIR/linux" -name "*.so*" -exec chmod +x {} \;
            chmod +x "$CEF_DIR/linux/gdCefRenderProcess"
            echo "✓ Linux binaries copied"
          else
            echo "⚠ Linux artifact directory not found at $LINUX_SRC/linux"
          fi

          # Copy Windows binaries
          if [ -d "$WINDOWS_SRC/windows" ]; then
            cp -a "$WINDOWS_SRC/windows/"* "$CEF_DIR/windows/"
            echo "✓ Windows binaries copied"
          else
            echo "⚠ Windows artifact directory not found at $WINDOWS_SRC/windows"
          fi

          # Copy shared files from Linux (or Windows)
          if [ -f "$LINUX_SRC/gdcef.gdextension" ]; then
            cp "$LINUX_SRC/gdcef.gdextension" "$CEF_DIR/"
            cp "$LINUX_SRC/VERSION" "$CEF_DIR/"
          elif [ -f "$WINDOWS_SRC/gdcef.gdextension" ]; then
            cp "$WINDOWS_SRC/gdcef.gdextension" "$CEF_DIR/"
            cp "$WINDOWS_SRC/VERSION" "$CEF_DIR/"
          fi

          # Copy documentation and license
          cp -r doc "$RELEASE_DIR/"
          cp LICENSE "$CEF_DIR/"

      - name: Create release zip
        run: |
          ZIP_NAME="gdcef-${{ steps.version.outputs.version }}_godot-${{ steps.version.outputs.godot_version }}.zip"
          # Verify permissions before zipping
          echo "=== Checking permissions before zip ==="
          ls -la "$RELEASE_DIR/cef_artifacts/linux/" | head -10
          # Create zip with symlinks preserved (-y)
          cd "$(dirname "$RELEASE_DIR")" && zip -ry "../$ZIP_NAME" "$(basename "$RELEASE_DIR")"/
          echo "=== Checking permissions in zip ==="
          zipinfo "../$ZIP_NAME" | grep -E "(gdCefRenderProcess|\.so)" | head -10
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload combined artifact
        uses: pyTooling/upload-artifact@v6
        with:
          name: gdcef-${{ steps.version.outputs.version }}_godot-${{ steps.version.outputs.godot_version }}
          path: ${{ env.RELEASE_DIR }}/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
